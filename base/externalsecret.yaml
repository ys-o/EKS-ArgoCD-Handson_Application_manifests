apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-external-secret
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: rds-secret
  secretStoreRef:
    name: rds-secret-store
    kind: SecretStore
  data:
    - secretKey: DB_USER
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-1:619071321369:secret:rds!db-dad050ae-2fa0-43af-afb8-5d117a64051d-3arKVf
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: arn:aws:secretsmanager:ap-northeast-1:619071321369:secret:rds!db-dad050ae-2fa0-43af-afb8-5d117a64051d-3arKVf
        property: password

