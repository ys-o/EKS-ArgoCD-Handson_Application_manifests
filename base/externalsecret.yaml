apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rds-external-secret
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  target:
    name: rds-secret
  secretStoreRef:
    name: rds-secret-store
    kind: SecretStore
  data:
    - secretKey: DB_USER
      remoteRef:
        key: #シークレットマネージャーのARN
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: #シークレットマネージャーのARN
        property: password

